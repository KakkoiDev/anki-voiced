[project]
name = "anki-voiced"
version = "0.2.0"
description = "Generate Japanese Anki flashcard decks with AI-voiced audio, pitch accent, and furigana"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["anki", "flashcards", "tts", "japanese", "furigana", "pitch-accent", "edge-tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "jp-core @ git+https://github.com/KakkoiDev/jp-core.git@211c0b079bbc18925b3ba2976f78c74b15cf1cc7",
    "genanki>=0.13.1",
    "edge-tts>=6.1.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fugashi>=1.5.2",
    "unidic>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

# Python 3.10 compatibility - tomllib is only built-in from 3.11+
py310 = [
    "tomli>=2.0.0",
]

[project.scripts]
anki-voiced = "anki_voiced.cli:app"

[project.urls]
Homepage = "https://github.com/kakkoidev/anki-voiced"
Repository = "https://github.com/kakkoidev/anki-voiced"
Issues = "https://github.com/kakkoidev/anki-voiced/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/anki_voiced"]

[tool.hatch.build.targets.wheel.shared-data]
"src/anki_voiced/templates/assets" = "anki_voiced/templates/assets"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=anki_voiced"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning:pydantic",
    "ignore:.*shadows an attribute in parent.*:UserWarning",
]
